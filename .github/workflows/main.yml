name: PufferPanel & Cloudflare CLI Tunnel

on:
  workflow_dispatch:

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Latest PufferPanel
        run: |
          echo "Installing PufferPanel..."
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packagecloud.io/pufferpanel/pufferpanel/gpgkey | gpg --dearmor | sudo tee /etc/apt/keyrings/pufferpanel.gpg > /dev/null

          echo "X-Repolib-Name: PufferPanel
          Types: deb
          URIs: https://packagecloud.io/pufferpanel/pufferpanel/any/
          Suites: any
          Components: main
          Signed-By: /etc/apt/keyrings/pufferpanel.gpg" | sudo tee /etc/apt/sources.list.d/pufferpanel.sources > /dev/null

          sudo apt-get update
          sudo apt-get install -y pufferpanel

          # Enable Docker support
          sudo usermod -aG docker pufferpanel || true

      - name: Create Admin Account & Start PufferPanel
        run: |
          echo "Creating admin account: admin / admin121..."
          sudo pufferpanel user add --name admin --email admin@example.com --password admin121 --admin

          echo "Starting PufferPanel service..."
          sudo systemctl enable --now pufferpanel
          sleep 4

      - name: Install Cloudflare CLI (cloudflared)
        run: |
          echo "Installing Cloudflare CLI..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Start Cloudflare CLI Tunnel & Print Link
        run: |
          echo "Starting Cloudflare Quick Tunnel on port 8080..."
          # Start cloudflared directly via CLI without any tokens or account
          cloudflared tunnel --url http://localhost:8080 --logfile /tmp/cloudflared.log &

          # Wait for the tunnel link to be generated
          sleep 6

          echo "=========================================================="
          echo "YOUR PUFFERPANEL LOGIN LINK:"
          grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1
          echo ""
          echo "Login Username: admin (or admin@example.com)"
          echo "Login Password: admin121"
          echo "=========================================================="

      - name: Keep Runner Alive
        run: |
          echo "PufferPanel is running. Click 'Cancel workflow' when done."
          sleep 21000
