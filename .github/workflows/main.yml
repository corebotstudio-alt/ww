name: PufferPanel & Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max runner duration (6 hours)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Latest PufferPanel
        run: |
          echo "=========================================================="
          echo "Installing Latest PufferPanel..."
          echo "=========================================================="
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packagecloud.io/pufferpanel/pufferpanel/gpgkey | gpg --dearmor | sudo tee /etc/apt/keyrings/pufferpanel.gpg > /dev/null

          echo "X-Repolib-Name: PufferPanel
          Types: deb
          URIs: https://packagecloud.io/pufferpanel/pufferpanel/any/
          Suites: any
          Components: main
          Signed-By: /etc/apt/keyrings/pufferpanel.gpg" | sudo tee /etc/apt/sources.list.d/pufferpanel.sources > /dev/null

          sudo apt-get update
          sudo apt-get install -y pufferpanel

          # Enable Docker support
          sudo usermod -aG docker pufferpanel || true

      - name: Create Admin Account & Start PufferPanel
        run: |
          echo "Creating admin account: admin / admin121..."
          sudo pufferpanel user add --name admin --email admin@example.com --password admin121 --admin

          echo "Starting PufferPanel service..."
          sudo systemctl enable --now pufferpanel

          echo "Waiting for PufferPanel to be ready on port 8080..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              echo "PufferPanel is up and responding!"
              break
            fi
            echo "Waiting for service to start... ($i/30)"
            sleep 2
          done

      - name: Install Cloudflare CLI
        run: |
          echo "Installing cloudflared..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Start Cloudflare Tunnel & Extract Link
        run: |
          echo "Starting Cloudflare Quick Tunnel..."
          # Target IPv4 127.0.0.1 to avoid IPv6 502 errors
          cloudflared tunnel --url http://127.0.0.1:8080 --logfile /tmp/cloudflared.log &

          echo "Waiting for Cloudflare to generate your public link..."
          URL=""
          for i in {1..20}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error ::Cloudflare failed to generate URL. Full log:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "=========================================================="
          echo "SUCCESS! ACCESS YOUR PUFFERPANEL HERE:"
          echo "$URL"
          echo ""
          echo "Username: admin (or admin@example.com)"
          echo "Password: admin121"
          echo "=========================================================="

      - name: Keep Runner Alive (Up to 6 Hours)
        run: |
          echo "PufferPanel is running. Click 'Cancel workflow' in GitHub to stop."
          # Keeps this runner alive for ~5 hours 50 minutes (21000s)
          sleep 21000
